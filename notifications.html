<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinder Sports — Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sips-design-system.css">
<link rel="stylesheet" href="sips-mobile.css">
<script src="sips-shell.js"></script>
<script src="sips-mobile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--paper-0);font-family:var(--font-body);color:var(--ink-800);}
.content{padding:22px 28px 40px;max-width:1100px;}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.tab{font-family:var(--font-display);font-size:12.5px;font-weight:600;padding:9px 14px;border:none;background:none;color:var(--muted);cursor:pointer;position:relative;top:1px;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--ink-800);}
.tab.active{color:var(--brand-orange);border-bottom-color:var(--brand-orange);}
.tab .cnt{font-family:var(--font-mono);font-size:10px;background:var(--line-2);color:var(--ink-700);padding:1px 6px;border-radius:var(--r-pill);}
.tab.active .cnt{background:var(--brand-orange);color:#fff;}

.toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sel-mini{font-family:var(--font-display);font-size:11.5px;font-weight:600;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper-1);color:var(--ink-700);cursor:pointer;}
.link-btn{font-family:var(--font-display);font-size:11.5px;font-weight:600;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper-1);color:var(--ink-700);cursor:pointer;}
.link-btn:hover{border-color:var(--brand-orange);color:var(--brand-orange);}

.list{display:flex;flex-direction:column;gap:8px;}
.notif-row{display:flex;gap:12px;align-items:flex-start;background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;cursor:pointer;transition:border-color .12s ease, background .12s ease, box-shadow .12s ease;}
.notif-row:hover{border-color:var(--muted-2);box-shadow:var(--shadow-sm);}
.notif-row.unread{background:var(--paper-0);border-left:3px solid var(--brand-orange);}
.notif-row .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.dot.good{background:var(--status-good);} .dot.watch{background:var(--status-watch);} .dot.bad{background:var(--status-bad);} .dot.info{background:var(--status-info);}
.notif-body{flex:1;min-width:0;}
.notif-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.notif-title{font-weight:700;font-family:var(--font-display);font-size:13px;color:var(--ink-900);}
.notif-msg{font-size:12px;color:var(--ink-700);margin-top:3px;line-height:1.4;}
.notif-meta{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;}
.type-tag{font-family:var(--font-display);font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-sm);white-space:nowrap;}
.type-tag.ncr{background:var(--status-bad-bg);color:var(--status-bad);}
.type-tag.dr{background:var(--status-info-bg);color:var(--status-info);}
.type-tag.co{background:var(--status-watch-bg);color:var(--status-watch);}
.type-tag.vendor{background:var(--status-watch-bg);color:var(--status-watch);}
.priority-tag{font-family:var(--font-display);font-size:9px;font-weight:700;padding:2px 7px;border-radius:var(--r-sm);background:var(--status-bad-bg);color:var(--status-bad);}
.notif-actions{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.notif-actions button{font-family:var(--font-display);font-size:10.5px;font-weight:600;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;}
.notif-actions button:hover{color:var(--status-bad);}

.empty{background:var(--paper-1);border:1px dashed var(--line);border-radius:var(--r-lg);padding:36px;text-align:center;color:var(--muted);}
.empty .big{font-size:15px;color:var(--ink-700);font-family:var(--font-display);font-weight:700;margin-bottom:6px;}
.loading{padding:40px;text-align:center;color:var(--muted);}

@media(max-width:640px){ .notif-top{flex-direction:column;align-items:flex-start;gap:4px;} }
</style>
</head>
<body>

<div id="sips-sidebar-mount"></div>

<div class="app-main">
  <div class="app-topbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="app-hamburger" id="app-hamburger-btn" aria-label="Toggle menu">&#9776;</button>
      <div>
        <div class="app-title">Notifications</div>
        <div class="app-subtitle">Everything that needs your attention</div>
      </div>
    </div>
    <div class="app-user-chip">
      <div class="app-user-avatar" id="userAvatar">–</div>
      <div class="app-user-meta">
        <div class="app-user-name" id="userName">—</div>
        <div class="app-user-role" id="userRole">—</div>
      </div>
      <button class="app-logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading notifications…</div>
  </div>
</div>

<script>
function esc(v){ return (v==null?'':String(v)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function timeAgo(d){
  if(!d) return '—';
  const diffMs = Date.now() - new Date(d).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + ' hr' + (hrs>1?'s':'') + ' ago';
  const days = Math.floor(hrs/24);
  return days + ' day' + (days>1?'s':'') + ' ago';
}

const READ_KEY = 'sips_read_notifs';
function getReadSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(READ_KEY)||'[]')); }catch(e){ return new Set(); }
}
function saveReadSet(set){ try{ localStorage.setItem(READ_KEY, JSON.stringify(Array.from(set))); }catch(e){} }
let READ = getReadSet();

let ALL_NOTIFS = [];
let PROJECTS = {};
let ACTIVE_TAB = 'all';
let ACTIVE_PROJECT = 'all';

(async function(){
  const auth = await requireAuth();
  if(!auth) return;
  const { session, role } = auth;

  const roleLabels = { director:'Director', pm:'Project Manager', engineer:'Site Engineer', vendor:'Vendor', client:'Client' };
  const emailName = (session.user.email || 'Signed in').split('@')[0];
  document.getElementById('userName').textContent = emailName;
  document.getElementById('userRole').textContent = roleLabels[role] || role || '—';
  document.getElementById('userAvatar').textContent = emailName.charAt(0).toUpperCase();
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); window.location.href = 'login.html'; });

  document.querySelectorAll('[data-perm]').forEach(el=>{
    const perm = el.getAttribute('data-perm');
    const grants = { export_reports:['director','pm'], view_vendors:['director','pm'], manage_settings:['director'], import_project:['director','pm'] };
    el.style.display = (grants[perm]||[]).includes(role) ? '' : 'none';
  });
  document.querySelectorAll('[data-perm-group="director-pm"]').forEach(el=>{
    el.style.display = (role === 'director' || role === 'pm') ? '' : 'none';
  });

  await loadAll();
})();

async function loadAll(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading notifications…</div>';

  const [{data: projects}, {data: ncrs}, {data: drawings}, {data: cos}, {data: vendors}] = await Promise.all([
    sb.from('projects').select('id,name'),
    sb.from('ncrs').select('*'),
    sb.from('drawings').select('*'),
    sb.from('change_orders').select('*'),
    sb.from('vendors').select('*')
  ]);

  (projects||[]).forEach(p => PROJECTS[p.id] = p.name);

  const notifs = [];

  (ncrs||[]).filter(n=>n.status==='open').forEach(n=>{
    notifs.push({
      id: 'ncr_'+n.id, type:'ncr', typeLabel:'Quality / NCR', dotCls:'bad', priority:'high',
      title: n.title || ('NCR #'+n.id),
      msg: n.description || 'Open non-conformance report needs review.',
      project_id: n.project_id,
      created_at: n.created_at,
      link: 'quality.html'
    });
  });

  (drawings||[]).filter(d=>(d.status||'').includes('pending')).forEach(d=>{
    notifs.push({
      id: 'dr_'+d.id, type:'dr', typeLabel:'Drawings', dotCls:'info', priority:'normal',
      title: d.name || d.title || ('Drawing #'+d.id),
      msg: 'Awaiting review / approval.',
      project_id: d.project_id,
      created_at: d.created_at,
      link: 'drawings.html'
    });
  });

  (cos||[]).filter(c=>c.status!=='approved' && c.status!=='rejected').forEach(c=>{
    notifs.push({
      id: 'co_'+c.id, type:'co', typeLabel:'Change Order', dotCls:'watch', priority:'high',
      title: c.title || c.description || ('Change Order #'+c.id),
      msg: c.description || 'Pending director approval.',
      project_id: c.project_id,
      created_at: c.created_at,
      link: 'approvals.html'
    });
  });

  (vendors||[]).filter(v=>(v.sla_status||'').includes('escalated')).forEach(v=>{
    notifs.push({
      id: 'vendor_'+v.id, type:'vendor', typeLabel:'Vendor SLA', dotCls:'watch', priority:'high',
      title: (v.name || 'Vendor') + ' — SLA escalated',
      msg: 'This vendor has an escalated SLA status and may need follow-up.',
      project_id: v.project_id || null,
      created_at: v.updated_at || v.created_at,
      link: 'vendors.html'
    });
  });

  notifs.sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));
  ALL_NOTIFS = notifs;
  render();
}

function render(){
  const content = document.getElementById('content');
  const cnt = k => ALL_NOTIFS.filter(n => k==='all' || n.type===k).length;
  const unreadCount = ALL_NOTIFS.filter(n => !READ.has(n.id)).length;

  const badge = document.getElementById('sideNotifBadge');
  if(badge){ if(unreadCount>0){ badge.textContent = unreadCount; badge.style.display=''; } else { badge.style.display='none'; } }

  const projectOptions = ['<option value="all">All projects</option>']
    .concat(Object.entries(PROJECTS).map(([id,name])=>`<option value="${esc(id)}" ${ACTIVE_PROJECT===String(id)?'selected':''}>${esc(name)}</option>`));

  let html = `<div class="toolbar">
    <div class="tabs">
      ${tabBtn('all','All', cnt('all'))}
      ${tabBtn('ncr','NCR', cnt('ncr'))}
      ${tabBtn('dr','Drawings', cnt('dr'))}
      ${tabBtn('co','Change Orders', cnt('co'))}
      ${tabBtn('vendor','Vendor SLA', cnt('vendor'))}
    </div>
    <div class="toolbar-right">
      <select class="sel-mini" id="projectFilter">${projectOptions.join('')}</select>
      <button class="link-btn" id="markAllReadBtn">Mark all read</button>
    </div>
  </div>`;

  let rows = ALL_NOTIFS.filter(n => ACTIVE_TAB==='all' || n.type===ACTIVE_TAB);
  if(ACTIVE_PROJECT !== 'all') rows = rows.filter(n => String(n.project_id) === String(ACTIVE_PROJECT));

  if(!rows.length){
    html += `<div class="empty"><div class="big">All clear ✓</div>No notifications match this filter.</div>`;
  } else {
    html += `<div class="list">` + rows.map(rowHtml).join('') + `</div>`;
  }

  content.innerHTML = html;

  document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=>{ ACTIVE_TAB = b.getAttribute('data-tab'); render(); }));
  document.getElementById('projectFilter').addEventListener('change', (e)=>{ ACTIVE_PROJECT = e.target.value; render(); });
  document.getElementById('markAllReadBtn').addEventListener('click', ()=>{
    ALL_NOTIFS.forEach(n=>READ.add(n.id));
    saveReadSet(READ);
    render();
  });

  document.querySelectorAll('.notif-row').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.notif-dismiss')) return;
      const id = el.getAttribute('data-id');
      const notif = ALL_NOTIFS.find(n=>n.id===id);
      if(!notif) return;
      READ.add(id); saveReadSet(READ);
      window.location.href = notif.link;
    });
  });
  document.querySelectorAll('.notif-dismiss').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      READ.add(id); saveReadSet(READ);
      render();
    });
  });
}

function tabBtn(key, label, count){
  return `<button class="tab ${ACTIVE_TAB===key?'active':''}" data-tab="${key}">${esc(label)} <span class="cnt">${count}</span></button>`;
}

function rowHtml(n){
  const isUnread = !READ.has(n.id);
  const proj = PROJECTS[n.project_id] || '—';
  return `<div class="notif-row ${isUnread?'unread':''}" data-id="${esc(n.id)}">
    <span class="dot ${n.dotCls}"></span>
    <div class="notif-body">
      <div class="notif-top">
        <span class="notif-title">${esc(n.title)}</span>
        <span class="type-tag ${n.type}">${esc(n.typeLabel)}</span>
        ${n.priority==='high' ? '<span class="priority-tag">Needs attention</span>' : ''}
      </div>
      <div class="notif-msg">${esc(n.msg)}</div>
      <div class="notif-meta"><span>${esc(proj)}</span><span>${esc(timeAgo(n.created_at))}</span></div>
    </div>
    <div class="notif-actions">
      <button class="notif-dismiss" data-id="${esc(n.id)}" title="Mark as read">Dismiss</button>
    </div>
  </div>`;
}
</script>
<script>
sipsRenderShell({ activeHref: "notifications.html" });
</script>
</body>
</html>
