<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile — Kinder Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sips-design-system.css">
<link rel="stylesheet" href="sips-mobile.css">
<script src="sips-shell.js"></script>
<script src="sips-mobile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--paper-0);color:var(--ink-800);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#D7DAE0;border-radius:6px;}
/* (unused .lanes/.topbar/.user-chip/.user-avatar/.user-name/.user-role/.hamburger
   rules removed — this page actually uses the shared .app-lanes/.app-topbar/
   .app-user-chip/.app-user-avatar/.app-user-meta/.app-hamburger classes) */
.btn{font-family:var(--font-display);font-size:12px;font-weight:600;padding:9px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper-1);cursor:pointer;color:var(--ink-800);transition:border-color .15s ease, color .15s ease, background .15s ease;}
.btn:hover{border-color:var(--brand-orange);color:var(--brand-orange);}
.btn.dark{background:var(--ink-900);color:#fff;border-color:var(--ink-900);}
.btn.dark:hover{background:var(--brand-orange);border-color:var(--brand-orange);color:#fff;}
.btn:disabled{opacity:.55;cursor:not-allowed;}

.content{max-width:860px;margin:0 auto;padding:26px 32px 60px 32px;}
.card{background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:20px;}
.card h3{font-family:var(--font-display);font-size:15px;margin:0 0 4px 0;color:var(--ink-900);}
.card .desc{font-size:11.5px;color:var(--muted);margin:0 0 18px 0;line-height:1.5;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.fld{margin-bottom:2px;}
.fld.full{grid-column:1 / -1;}
.fld label{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:var(--font-display);font-weight:600;}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;font-family:var(--font-body);background:var(--paper-0);color:var(--ink-800);}
.fld textarea{resize:vertical;min-height:64px;}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--brand-blue);outline-offset:0;border-color:var(--brand-blue);background:var(--paper-1);}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;align-items:center;}
#msg{font-size:12px;margin-right:auto;}
#msg.ok{color:var(--brand-green);} #msg.err{color:var(--status-bad);}
.section-label{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-700);margin:24px 0 12px 0;grid-column:1 / -1;}
.readonly-note{background:var(--status-info-bg);color:var(--status-info);border-radius:var(--r-md);padding:11px 15px;font-size:12px;margin-bottom:18px;}
.loading{padding:44px;text-align:center;color:var(--muted);}
.logo-preview{width:64px;height:64px;border-radius:var(--r-md);object-fit:contain;border:1px solid var(--line);background:var(--paper-0);margin-top:8px;display:none;}
@media(max-width:820px){
  .content{padding-left:18px;padding-right:18px;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="sips-sidebar-mount"></div>

<div class="app-main">
  <div class="app-lanes"><span class="l1"></span><span class="l2"></span><span class="l3"></span><span class="l4"></span></div>
  <div class="app-topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="app-hamburger" id="app-hamburger-btn" aria-label="Toggle menu">&#9776;</button>
      <div>
        <div class="app-title">Company profile</div>
        <div class="app-subtitle">Your company details, used across reports and documents</div>
      </div>
    </div>
    <div class="app-user-chip">
      <div class="app-user-avatar" id="userAvatar">–</div>
      <div class="app-user-meta">
        <div class="app-user-name" id="userName">—</div>
        <div class="app-user-role" id="userRole">—</div>
      </div>
      <button class="app-logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading company profile…</div>
  </div>
</div>

<template id="formTpl">
  <div class="card">
    <h3>Company Details</h3>
    <p class="desc">These details appear on reports, budget sheets and client-facing documents. You can fill in the credentials and other fields later &mdash; nothing here is mandatory to start.</p>
    <div id="roNote"></div>
    <div class="grid">
      <div class="fld full">
        <label>Company Name</label>
        <input type="text" id="f_name" placeholder="e.g. KinderSports LLP">
      </div>
      <div class="fld full">
        <label>Logo URL</label>
        <input type="text" id="f_logo_url" placeholder="https://…/logo.png">
        <img class="logo-preview" id="logoPreview" alt="logo">
      </div>
      <div class="fld full">
        <label>Address</label>
        <textarea id="f_address" placeholder="Registered / office address"></textarea>
      </div>

      <div class="section-label">Registration</div>
      <div class="fld"><label>GST Number</label><input type="text" id="f_gst_number" placeholder="GSTIN"></div>
      <div class="fld"><label>Registration / CIN</label><input type="text" id="f_registration_number" placeholder="Registration no."></div>

      <div class="section-label">Contact</div>
      <div class="fld"><label>Phone</label><input type="text" id="f_phone" placeholder="+91 …"></div>
      <div class="fld"><label>Email</label><input type="text" id="f_email" placeholder="info@company.com"></div>
      <div class="fld full"><label>Website</label><input type="text" id="f_website" placeholder="https://…"></div>

      <div class="section-label">Bank Details</div>
      <div class="fld"><label>Bank Name</label><input type="text" id="f_bank_name" placeholder="Bank name"></div>
      <div class="fld"><label>Account Number</label><input type="text" id="f_bank_account" placeholder="Account no."></div>
      <div class="fld"><label>IFSC</label><input type="text" id="f_bank_ifsc" placeholder="IFSC code"></div>
    </div>

    <div class="actions">
      <span id="msg"></span>
      <button class="btn dark" id="saveBtn">Save Changes</button>
    </div>
  </div>
</template>

<script>

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const FIELDS = ['name','logo_url','address','gst_number','registration_number','phone','email','website','bank_name','bank_account','bank_ifsc'];

let COMPANY_ID = null, ROLE = null, EXISTS = false;

function canEdit(role){ return role === 'director' || role === 'pm'; }

function setMsg(t,cls){ const m=document.getElementById('msg'); if(!m) return; m.textContent=t||''; m.className=cls||''; }

function fillForm(c){
  FIELDS.forEach(f=>{ const el=document.getElementById('f_'+f); if(el) el.value = (c && c[f]!=null) ? c[f] : ''; });
  const logo=document.getElementById('f_logo_url'), prev=document.getElementById('logoPreview');
  const sync=()=>{ if(logo.value.trim()){ prev.src=logo.value.trim(); prev.style.display='block'; } else prev.style.display='none'; };
  logo.addEventListener('input', sync); sync();
}

async function save(){
  const btn=document.getElementById('saveBtn'); btn.disabled=true; setMsg('Saving…','');
  const row={ id: COMPANY_ID };
  FIELDS.forEach(f=>{ const el=document.getElementById('f_'+f); row[f] = el && el.value.trim()!=='' ? el.value.trim() : null; });
  const { error } = await sb.from('companies').upsert(row);
  btn.disabled=false;
  if(error){ setMsg('Could not save: '+error.message,'err'); return; }
  EXISTS=true;
  setMsg('Saved.','ok');
}

(async function(){
  const auth = await requireAuth();
  if(!auth) return;
  const { session, role, companyId } = auth;
  ROLE = role; COMPANY_ID = companyId;

  const roleLabels={director:'Director',pm:'Project Manager',engineer:'Site Engineer',vendor:'Vendor',client:'Client'};
  const emailName=(session.user.email||'Signed in').split('@')[0];
  document.getElementById('userName').textContent=emailName;
  document.getElementById('userRole').textContent=roleLabels[role]||role||'—';
  document.getElementById('userAvatar').textContent=emailName.charAt(0).toUpperCase();
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); window.location.href = 'login.html'; });

  const content=document.getElementById('content');

  if(!COMPANY_ID){
    content.innerHTML='<div class="card"><h3>No company linked</h3><p class="desc">This account isn\'t linked to a company yet. Please contact your administrator.</p></div>';
    return;
  }

  // load existing company row (if any)
  let company=null;
  const { data, error } = await sb.from('companies').select('*').eq('id', COMPANY_ID).maybeSingle();
  if(error && error.code !== 'PGRST116'){
    content.innerHTML='<div class="card"><h3>Could not load</h3><p class="desc">'+esc(error.message)+'</p></div>';
    return;
  }
  company=data; EXISTS=!!data;

  // render form
  content.innerHTML='';
  content.appendChild(document.getElementById('formTpl').content.cloneNode(true));

  if(!canEdit(role)){
    document.getElementById('roNote').innerHTML='<div class="readonly-note">You have view-only access. Only a Director or Project Manager can edit these details.</div>';
    FIELDS.forEach(f=>{ const el=document.getElementById('f_'+f); if(el) el.disabled=true; });
    const sb2=document.getElementById('saveBtn'); if(sb2) sb2.style.display='none';
  } else {
    document.getElementById('saveBtn').addEventListener('click', save);
  }

  fillForm(company||{});
})();
</script>
<script>
sipsRenderShell({ activeHref: "company.html" });
</script>
</body>
</html>
